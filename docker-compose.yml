services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtproxy
      POSTGRES_USER: mtproxy
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql

volumes:
  pgdata:
